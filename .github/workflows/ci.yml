name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm format:check && pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db

      # Worker integration tests (merged into db job to share the DB service)
      - name: Install worker dependencies
        working-directory: apps/worker
        run: |
          uv sync --frozen
      - name: Create worker DB user
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d postgres -c "
            DO \$\$ 
            BEGIN 
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='worker') THEN 
                CREATE ROLE worker WITH LOGIN PASSWORD 'worker';
              END IF;
            END 
            \$\$;
          "
      - name: Run worker integration tests
        working-directory: apps/worker
        env:
          TEST_WORKER_DATABASE_URL: postgresql://worker:worker@127.0.0.1:5432/postgres
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest -m integration

  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/worker } }
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m unit
      - run: uv run pip-audit
      - run: docker build -t worker-ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
