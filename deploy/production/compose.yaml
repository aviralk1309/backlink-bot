name: backlink-bot

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase project URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the Supabase anon key}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase project URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the Supabase anon key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only service role key}
      APP_URL: ${APP_URL:?Set the public app URL}
      MAIL_MODE: smtp
      MAIL_FROM: ${MAIL_FROM:?Set the sender address}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Set the SMTP username}
      SMTP_PASS: ${SMTP_PASS:?Set the SMTP password}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the worker-role Supabase connection string}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-4}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase project URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only service role key}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SITE_CRAWL_ENABLED: ${SITE_CRAWL_ENABLED:-false}
      LINK_VERIFICATION_ENABLED: ${LINK_VERIFICATION_ENABLED:-false}
      BOT_USER_AGENT: ${BOT_USER_AGENT:?Set a real crawler name and contact URL}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set the Cloudflare Tunnel token}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
